# ── Servidor ──────────────────────────────────────────────────
server.port=8083
spring.application.name=ride-service

# ── Banco H2 (dev) ────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:uniride_rides;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── H2 Console ────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=uniride-dev-secret-key-must-be-at-least-256-bits-long-change-in-prod

# ── Feign ─────────────────────────────────────────────────────
user.service.url=http://localhost:8081

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logs ──────────────────────────────────────────────────────
logging.level.com.uniride=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
