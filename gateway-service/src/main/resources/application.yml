spring:
  application:
    name: gateway-service

  codec:
    max-in-memory-size: 10485760  # 10MB — suporta upload de foto de perfil em base64

  cloud:
    gateway:
      routes:

        # Auth
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Participantes
        - id: user-service-participantes
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/participantes/**

        # Instituicoes
        - id: institution-service
          uri: ${INSTITUTION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/instituicoes/**

        # Amizades
        - id: user-service-amizades
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/amizades/**

        # Preferencias
        - id: user-service-preferencias
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/preferencias/**

        # Caronas
        - id: ride-service-caronas
          uri: ${RIDE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/caronas/**

        # Rotinas
        - id: ride-service-rotinas
          uri: ${RIDE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/rotinas/**

        # Solicitacoes
        - id: ride-service-solicitacoes
          uri: ${RIDE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/solicitacoes/**

        # Avaliacoes
        - id: ride-service-avaliacoes
          uri: ${RIDE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/avaliacoes/**

        # Denuncias
        - id: user-service-denuncias
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/denuncias/**

        # Bloqueios
        - id: user-service-bloqueios
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/bloqueios/**

        # Admin
        - id: user-service-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:uniride-dev-secret-key-must-be-at-least-256-bits-long-change-in-prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.uniride: DEBUG
    org.springframework.cloud.gateway: INFO
