spring:
  application:
    name: institution-service
  profiles:
    active: dev

server:
  port: 8082
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:uniride-dev-secret-key-must-be-at-least-256-bits-long-change-in-prod}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

emec:
  api:
    url: ${EMEC_API_URL:https://emec.mec.gov.br/emec/consulta/getIes}

logging:
  level:
    com.uniride: DEBUG
    org.hibernate.SQL: DEBUG
